# Builds both installers on every push and pull request, and publishes a release when run by hand on main
# with "Publish a release" ticked. Releases and normal builds share this workflow so they share one run number,
# which numbers the builds (see "Versions" in docs/technical.md).
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (from main only)
        type: boolean
        default: false
      notes:
        description: Release notes (empty for notes generated from the changes)
        type: string
        default: ''

permissions:
  contents: write  # release, metadata tags
  actions: read    # earlier runs of the same commit, for the revision

# Only one release at a time; normal builds run in parallel
concurrency:
  group: ${{ inputs.release && 'release' || github.run_id }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check where a release runs
        if: inputs.release && github.ref != 'refs/heads/main'
        run: throw 'Releases are published from main only'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all history and tags: the version comes from the metadata tags
          fetch-tags: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 7
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $exe
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '^CN=Pyrsys B\.V\.,') {
            throw "Unexpected signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait

      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: installer\build.ps1 -Release:$${{ inputs.release == true }}

      - uses: actions/upload-artifact@v4
        with:
          name: WinHotCorner-${{ steps.build.outputs.file-name-version }}
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.file-name-version }}
          NOTES: ${{ inputs.notes }}
        run: |
          $tag = "v$env:VERSION"

          # Drafts left by failed release runs
          gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | ForEach-Object {
            gh release delete $_ --yes
            if ($LASTEXITCODE -ne 0) { throw "Cannot delete draft $_" }
          }

          # A draft first: nobody sees it, and GitHub creates the tag only when it is published
          $files = (Get-ChildItem installer\Output\*.exe).FullName
          $notes = if ($env:NOTES) { @('--notes', $env:NOTES) } else { @('--generate-notes') }
          gh release create $tag @files --draft --target $env:GITHUB_SHA --title "WinHotCorner $env:VERSION" @notes
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the draft release' }

          $assets = gh release view $tag --json assets --jq '[.assets[] | select(.size > 0)] | length'
          if ([int]$assets -ne 2) { throw "The draft has $assets installers, expected 2; it stays a draft" }

          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish the release' }

      - name: Start the next development line
        if: inputs.release
        env:
          MAJOR: ${{ steps.build.outputs.major }}
          MINOR: ${{ steps.build.outputs.minor }}
        run: |
          $line = "metadata/line-$env:MAJOR.$([int]$env:MINOR + 1)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' `
            tag -a $line -m "Start of the next development line, after the release from run $env:GITHUB_RUN_NUMBER" -m "baseline-run: $env:GITHUB_RUN_NUMBER" $env:GITHUB_SHA
          git push origin "refs/tags/$line"
          if ($LASTEXITCODE -ne 0) { throw "Cannot push $line" }
