; WinHotCorner settings (portable)
;
; While this file is next to WinHotCorner.exe, WinHotCorner reads its settings from here, writes its log
; (WinHotCorner.log) next to it and writes nothing to the registry.
; Changes apply as soon as the file is saved. Remove a line to use its default.

; 0 turns the hot corner off: it exits, and does not start until this is 1 again
Enabled=1

; Which screens have a hot corner
;   0  the primary screen and screens with no other screen at their top left
;   1  the primary screen only
;   2  screens with no other screen at their top left only
;   3  all screens
Screens=0

; Expand hot corner area: hold the pointer at a corner with another screen next to it
ExpandHotCornerArea=1

; Play a ripple at the corner when it triggers
ShowRipple=1

; In a right-to-left display language (such as Arabic or Hebrew), use the top-right corner
MirrorForRightToLeft=1

; Don't trigger while an app is fullscreen on that screen
DisableWhenFullscreen=1

; Don't trigger while a mouse button is held
DisableWhenMouseDown=1

; How hard you have to push into the corner, 10 to 1000
PressureThreshold=100
